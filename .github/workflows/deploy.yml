name: Deploy to VPS

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/SECURITY-ADVISORIES.md
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Force rebuild without cache
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-vps1-vimtractor
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build production image
        env:
          FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
        run: |
          flags=()
          if [[ "$FORCE_REBUILD" == "true" ]]; then flags+=(--no-cache); fi
          docker buildx build "${flags[@]}" \
            --progress=plain \
            --platform linux/amd64 \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -f Dockerfile \
            -t ghcr.io/drabdadev/vimtractor:sha-${{ github.sha }} \
            --load \
            .
      - name: Export exact image
        run: docker save ghcr.io/drabdadev/vimtractor:sha-${{ github.sha }} | gzip > release-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-image
          path: release-image.tar.gz
          retention-days: 1

  deploy:
    name: Deploy VimTractor
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: release-image
      - name: Configure SSH access
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - name: Verify deployment
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: deploy-vimtractor
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -t ed25519 "$DEPLOY_HOST" 2>/dev/null > ~/.ssh/known_hosts
          test "$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}')" = 'SHA256:nDb39+jJylcefU4nqT/S11m13LTKNYTAsz7QeHXiRaI'
          python3 scripts/send-release-image.py release-image.tar.gz "${{ github.sha }}" "$DEPLOY_USER" "$DEPLOY_HOST"
