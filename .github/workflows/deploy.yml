name: Deploy to VPS

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/SECURITY-ADVISORIES.md
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Force rebuild without cache
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-vps1-vimtractor
  cancel-in-progress: false

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Set up Blacksmith Docker builder
        uses: useblacksmith/setup-docker-builder@6ff44f8e5255f9d8aa31ef22f7e57a2d926b7da0 # v1.11.0
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push production image
        id: image
        uses: useblacksmith/build-push-action@fb9e3e6a9299c78462bfadd0d93352c316adc9b8 # v2
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          no-cache: ${{ inputs.force_rebuild || false }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: ghcr.io/drabdadev/vimtractor:sha-${{ github.sha }}

  deploy:
    name: Deploy VimTractor
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare exact release image from GHCR
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker pull --platform linux/amd64 "ghcr.io/drabdadev/vimtractor@$IMAGE_DIGEST"
          docker tag "ghcr.io/drabdadev/vimtractor@$IMAGE_DIGEST" "ghcr.io/drabdadev/vimtractor:sha-${{ github.sha }}"
          docker save "ghcr.io/drabdadev/vimtractor:sha-${{ github.sha }}" | gzip > release-image.tar.gz
      - name: Configure SSH access
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - name: Verify deployment
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: deploy-vimtractor
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -t ed25519 "$DEPLOY_HOST" 2>/dev/null > ~/.ssh/known_hosts
          test "$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}')" = 'SHA256:nDb39+jJylcefU4nqT/S11m13LTKNYTAsz7QeHXiRaI'
          python3 scripts/send-release-image.py release-image.tar.gz "${{ github.sha }}" "$DEPLOY_USER" "$DEPLOY_HOST"
